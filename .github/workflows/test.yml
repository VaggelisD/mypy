name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'release*']
  pull_request:
    paths-ignore:
    - 'docs/**'
    - 'mypyc/doc/**'
    - '**/*.rst'
    - '**/*.md'
    - .gitignore
    - CREDITS
    - LICENSE

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  mypyc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    name: mypyc tests with py${{ matrix.python }}
    timeout-minutes: 60
    env:
      TOX_SKIP_MISSING_INTERPRETERS: False
      FORCE_COLOR: 1
      PY_COLORS: 1
      PYTHON_COLORS: 0
      TERM: xterm-color
      MYPY_FORCE_COLOR: 1
      MYPY_FORCE_TERMINAL_WIDTH: 200
      PYTEST_ADDOPTS: --color=yes

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - name: Install tox
      run: pip install setuptools==75.1.0 tox==4.26.0
    - name: Setup tox environment
      run: tox run -e py --notest
    - name: Test
      run: tox run -e py --skip-pkg-install -- -n 4 mypyc/test/

  typecheck:
    runs-on: ubuntu-latest
    name: Type check own code
    timeout-minutes: 30
    env:
      TOX_SKIP_MISSING_INTERPRETERS: False
      FORCE_COLOR: 1
      PY_COLORS: 1
      TERM: xterm-color
      MYPY_FORCE_COLOR: 1
      MYPY_FORCE_TERMINAL_WIDTH: 200
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install tox
      run: pip install setuptools==75.1.0 tox==4.26.0
    - name: Setup tox environment
      run: tox run -e type --notest
    - name: Type check
      run: tox run -e type --skip-pkg-install

  lint:
    runs-on: ubuntu-latest
    name: Formatting and code style
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install tox
      run: pip install setuptools==75.1.0 tox==4.26.0
    - name: Setup tox environment
      run: tox run -e lint --notest
    - name: Lint
      run: tox run -e lint --skip-pkg-install
