[tool.cibuildwheel]

build-frontend = "pip"
linux.manylinux-x86_64-image = "manylinux_2_28"
linux.manylinux-aarch64-image = "manylinux_2_28"
linux.musllinux-x86_64-image = "musllinux_1_2"

# Build CPython 3.10-3.14 on manylinux + macOS.
# Skip: PyPy, 32-bit, musllinux aarch64, Windows, free-threaded 3.13.
skip = [
  "pp*",
  "*-win32",
  "*-win_amd64",
  "*-musllinux_aarch64",
  "cp313t-*",
  "*-manylinux_i686",
]

build-verbosity = 1

linux.before-all = [
  "yum install -y llvm-toolset || yum -v install -y llvm-toolset",
]

[tool.cibuildwheel.config-settings]
--build-option = "--use-mypyc"

[tool.cibuildwheel.environment]
MYPY_USE_MYPYC = "1"
MYPYC_OPT_LEVEL = "3"
MYPYC_DEBUG_LEVEL = "0"

[tool.cibuildwheel.linux.environment]
MYPY_USE_MYPYC = "1"
MYPYC_OPT_LEVEL = "3"
MYPYC_DEBUG_LEVEL = "0"
PATH = "$PATH:/opt/rh/llvm-toolset-17.0/root/usr/bin"
LD_LIBRARY_PATH = "$LD_LIBRARY_PATH:/opt/rh/llvm-toolset-17.0/root/usr/lib64"
CC = "clang"

[[tool.cibuildwheel.overrides]]
select = "*musllinux*"
before-all = [
  "apk add --no-cache clang",
]
environment = { MYPY_USE_MYPYC = "1", MYPYC_OPT_LEVEL = "3", MYPYC_DEBUG_LEVEL = "0", CC = "clang" }
